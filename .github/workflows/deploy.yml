name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          for svc in auth-service wallet-service ledger-service notification-service; do
            docker build -t ghcr.io/${{ github.repository }}/$svc:${{ github.ref_name }} apps/$svc
            docker push ghcr.io/${{ github.repository }}/$svc:${{ github.ref_name }}
          done